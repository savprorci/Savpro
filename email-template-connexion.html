<!-- Supabase > Authentication > Emails > modèle « Magic link »
     (ce modèle est aussi utilisé pour l'envoi du code de connexion).
     Objet à saisir : Votre code de connexion SAV PRO -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:auto;padding:24px;color:#0f2a52">
  <h2 style="margin:0 0 8px;color:#e63946">SAV PRO Côte d’Ivoire</h2>
  <p style="margin:0 0 16px">Voici votre code de connexion à l’espace pro :</p>
  <p style="font-size:34px;font-weight:bold;letter-spacing:10px;margin:0 0 16px;background:#f3f6fb;padding:14px 18px;border-radius:12px;text-align:center">{{ .Token }}</p>
  <p style="margin:0 0 8px;color:#52627d;font-size:14px">Ce code est valable quelques minutes. Saisissez-le sur la page de connexion.</p>
  <p style="margin:0;color:#52627d;font-size:13px">Si vous n’êtes pas à l’origine de cette demande, ignorez simplement ce message.</p>
</div>
